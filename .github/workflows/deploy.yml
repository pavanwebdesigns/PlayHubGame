name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or tag to deploy. Defaults to main."
        required: false
        default: main
        type: string
      dry_run:
        description: "List file changes and upload nothing."
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Record deployed commit
        id: git
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Guard checks
        id: guard
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/ads.txt
          grep -F -q '#gpx-property-LC991' dist/ads.txt
          test -f dist/.htaccess
          bad=$(find dist \( -name '*.map' -o -name '.env' -o -name '.DS_Store' \) -print)
          if [ -n "$bad" ]; then
            echo "Refusing to upload:"
            printf '%s\n' "$bad"
            exit 1
          fi
          js=$(grep -oE 'assets/index-[^"]+\.js' dist/index.html | head -n 1)
          if [ -z "$js" ]; then
            echo "Could not find the main JS file name in dist/index.html."
            exit 1
          fi
          echo "js=$js" >> "$GITHUB_OUTPUT"

      - name: Check FTP server directory
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          case "$FTP_SERVER_DIR" in
            */) ;;
            *)
              echo "FTP_SERVER_DIR must end with a slash. Update the GitHub secret."
              exit 1
              ;;
          esac

      - name: Upload dist
        id: ftp
        # v4.4.0 (tag v4.4.0, 23 Apr 2026)
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          log-level: standard
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}

      - name: Smoke test
        id: smoke
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: |
          set -euo pipefail
          js='${{ steps.guard.outputs.js }}'
          deadline=$((SECONDS + 180))
          ok=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            html=$(curl -fsS --max-time 20 "https://playhubplace.com/" || true)
            if printf '%s' "$html" | grep -F "$js" >/dev/null; then
              ok=1
              break
            fi
            echo "Live HTML does not reference $js yet."
            sleep 15
          done
          ads=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "https://playhubplace.com/ads.txt" || true)
          if [ "$ok" -ne 1 ]; then
            echo "The live homepage still does not reference $js after 3 minutes. Flush the CDN cache in hPanel, then re-run this workflow."
            echo "result=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$ads" != "200" ]; then
            echo "/ads.txt returned HTTP $ads. Expected 200."
            echo "result=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "Homepage references $js and /ads.txt returned 200."
          echo "result=pass" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Deploy"
            echo "- Commit: \`${{ steps.git.outputs.sha }}\`"
            echo "- Ref input: \`${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'push' }}\`"
            echo "- Main JS: \`${{ steps.guard.outputs.js }}\`"
            echo "- Dry run: \`${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}\`"
            echo "- Smoke test: \`${{ steps.smoke.outcome }}\`"
            echo "- Upload and delete counts are the lines in the Upload dist step (\`Upload\`, \`File replace\`, \`Delete\`). This action publishes no count outputs."
          } >> "$GITHUB_STEP_SUMMARY"
